<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustomRig — Uncompromised Metal.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #F4F1EA;
            --ink: #101113;
            --racing-green: #0C1F16; 
            --bronze-dark: #2B231D;
            --navy-dark: #0D161E;
            --copper: #FF5A1F;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .serif { font-family: 'Newsreader', serif; }
        .mono { font-family: 'JetBrains+Mono', monospace; }

        .sharp-edge { border-radius: 0 !important; }
        .kerning-tight { letter-spacing: -0.04em; }
        .kerning-loose { letter-spacing: 0.1em; }

        /* Smooth View Transitions */
        .view-enter { opacity: 0; transform: translateY(10px); }
        .view-enter-active { opacity: 1; transform: translateY(0); transition: all 0.6s cubic-bezier(0.2, 0, 0, 1); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--paper); }
        ::-webkit-scrollbar-thumb { background: var(--ink); }

        input:focus { outline: none; border-color: var(--copper); }
        
        .blueprint-line {
            background-image: linear-gradient(to right, var(--ink) 1px, transparent 1px);
            background-size: 40px 100%;
            opacity: 0.1;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COMPONENTS ---

        const Nav = ({ currentView, setView, isAuthenticated, logout }) => (
            <nav className="fixed top-0 w-full z-50 mix-blend-difference px-8 py-10 flex justify-between items-baseline text-[#F4F1EA]">
                <button onClick={() => setView('landing')} className="flex items-center gap-3 group">
                    <svg viewBox="0 0 120 120" className="w-8 h-8" fill="currentColor">
                        <path d="M16 16 H104 V104 H16 Z M32 32 V88 H88 V32 Z" fillRule="evenodd"/>
                        <rect x="36" y="35" width="48" height="12" fill="#FF5A1F"/>
                        <rect x="36" y="54" width="48" height="12" fill="currentColor"/>
                        <rect x="36" y="73" width="48" height="12" fill="currentColor"/>
                    </svg>
                    <span className="serif text-2xl font-medium kerning-tight italic">CustomRig</span>
                </button>
                <div className="space-x-12 text-[11px] uppercase kerning-loose font-medium">
                    <button onClick={() => setView('how-it-works')} className={`hover:opacity-50 transition-opacity ${currentView === 'how-it-works' ? 'text-[#FF5A1F]' : ''}`}>How it Works</button>
                    <button onClick={() => setView(isAuthenticated ? 'dashboard' : 'landing')} className={`hover:opacity-50 transition-opacity ${currentView === 'dashboard' ? 'text-[#FF5A1F]' : ''}`}>Inventory</button>
                    {isAuthenticated ? (
                        <>
                            <button onClick={() => setView('profile')} className={`hover:opacity-50 transition-opacity ${currentView === 'profile' ? 'text-[#FF5A1F]' : ''}`}>Profile</button>
                            <button onClick={logout} className="hover:opacity-50 transition-opacity opacity-40">Logout</button>
                        </>
                    ) : (
                        <button onClick={() => setView('login')} className="hover:opacity-50 transition-opacity border border-[#F4F1EA]/20 px-4 py-1">Operator Login</button>
                    )}
                </div>
            </nav>
        );

        const Landing = ({ onAction }) => (
            <div className="view-enter view-enter-active">
                <section className="min-h-screen flex flex-col justify-center px-8 lg:px-24 bg-[#0C1F16] text-[#F4F1EA] relative">
                    <div className="max-w-6xl relative z-10">
                        <h1 className="serif text-[12vw] lg:text-[10rem] font-medium mb-12 kerning-tight">Rent the metal.</h1>
                        <div className="grid grid-cols-12 gap-8 items-start">
                            <p className="col-span-12 lg:col-span-5 text-2xl leading-relaxed kerning-tight opacity-90">
                                Skip the cloud bill. Direct access to bare-metal GPU clusters. No virtualization, no overhead.
                            </p>
                            <div className="col-span-12 lg:col-start-8 lg:col-span-5 pt-4">
                                <button onClick={onAction} className="bg-[#F4F1EA] text-[#0C1F16] px-12 py-5 text-sm uppercase kerning-loose font-semibold sharp-edge hover:opacity-90 transition-opacity">
                                    Configure Your Rig
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        );

        const Login = ({ onLogin }) => {
            const [mode, setMode] = useState('login'); // 'login' or 'register'

            return (
                <div className="view-enter view-enter-active min-h-screen flex items-center justify-center px-8 pt-24">
                    <div className="max-w-md w-full space-y-24">
                        <div className="text-center">
                            <h2 className="serif text-5xl italic mb-4">
                                {mode === 'login' ? 'Customer Login' : 'Create Account'}
                            </h2>
                            <p className="mono text-[10px] uppercase opacity-40 kerning-loose">
                                {mode === 'login' ? 'Initialize Secure Session' : 'Register Operator Identity'}
                            </p>
                        </div>
                        <form className="space-y-12" onSubmit={(e) => { e.preventDefault(); onLogin(); }}>
                            <div className="space-y-8">
                                {mode === 'register' && (
                                    <div className="view-enter view-enter-active relative">
                                        <label className="serif text-xs italic opacity-40 block mb-2">Full Name</label>
                                        <input type="text" placeholder="Jony Ive" className="w-full bg-transparent border-b border-[#101113]/20 py-2 serif italic text-xl focus:border-[#FF5A1F] transition-colors placeholder:opacity-10" required />
                                    </div>
                                )}
                                <div className="relative">
                                    <label className="serif text-xs italic opacity-40 block mb-2">Identifier</label>
                                    <input type="email" placeholder="email@address.com" className="w-full bg-transparent border-b border-[#101113]/20 py-2 serif italic text-xl focus:border-[#FF5A1F] transition-colors placeholder:opacity-10" required />
                                </div>
                                <div className="relative">
                                    <label className="serif text-xs italic opacity-40 block mb-2">Access Key</label>
                                    <input type="password" placeholder="••••••••" className="w-full bg-transparent border-b border-[#101113]/20 py-2 serif italic text-xl focus:border-[#FF5A1F] transition-colors placeholder:opacity-10" required />
                                </div>
                            </div>
                            <div className="flex flex-col gap-6">
                                <button className="bg-[#101113] text-[#F4F1EA] py-6 text-[11px] uppercase kerning-loose font-bold sharp-edge hover:bg-[#0C1F16] transition-colors">
                                    {mode === 'login' ? 'Initialize' : 'Create Identity'}
                                </button>
                                <button 
                                    type="button" 
                                    onClick={() => setMode(mode === 'login' ? 'register' : 'login')}
                                    className="text-[10px] uppercase kerning-loose opacity-40 hover:opacity-100 transition-opacity"
                                >
                                    {mode === 'login' ? 'Create Account' : 'Return to Sign In'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const Dashboard = () => {
            const inventory = [
                { id: 'starter', name: 'AI Starter', gpu: 'RTX 5090', status: 'QUEUED', eta: '< 24H', color: 'text-[#2B231D]' },
                { id: 'studio', name: 'Studio', gpu: 'RTX 6000 Ada', status: 'ACTIVE_NODE', eta: 'NOW', color: 'text-[#0D161E]' },
                { id: 'enterprise', name: 'Enterprise', gpu: 'H100 NVL', status: 'MAINTENANCE', eta: 'NEXT WEEK', color: 'text-[#0C1F16]' },
            ];

            return (
                <div className="view-enter view-enter-active pt-48 pb-24 px-8 lg:px-24">
                    <div className="flex justify-between items-end mb-24 border-b border-[#101113]/10 pb-8">
                        <div>
                            <h2 className="serif text-6xl italic">Fleet Status</h2>
                            <p className="mono text-[10px] uppercase opacity-40 mt-4">Real-time Node Telemetry</p>
                        </div>
                        <div className="mono text-[10px] text-[#FF5A1F] flex gap-8">
                            <span>LATENCY: 14MS</span>
                            <span>NODES_UP: 1,024</span>
                        </div>
                    </div>
                    <div className="space-y-4">
                        {inventory.map((item) => (
                            <div key={item.id} className="grid grid-cols-12 items-center p-8 bg-white/50 border border-[#101113]/5 hover:border-[#101113]/20 transition-all group">
                                <div className="col-span-12 lg:col-span-4 flex items-center gap-6">
                                    <div className={`w-2 h-2 ${item.status === 'ACTIVE_NODE' ? 'bg-[#FF5A1F]' : 'bg-[#101113]/20'}`}></div>
                                    <h3 className="serif text-2xl italic">{item.name}</h3>
                                </div>
                                <div className="col-span-12 lg:col-span-4 mono text-[10px] uppercase opacity-40">
                                    {item.gpu} // ID_{item.id.toUpperCase()}
                                </div>
                                <div className="col-span-12 lg:col-span-4 flex justify-between items-center">
                                    <div className="mono text-[10px] font-bold text-right w-full pr-12">
                                        <span className="opacity-20 mr-2">[STATUS:]</span>
                                        <span className={item.status === 'ACTIVE_NODE' ? 'text-[#FF5A1F]' : 'text-[#101113]'}>
                                            {item.status} // {item.eta}
                                        </span>
                                    </div>
                                    <button className="bg-[#101113] text-[#F4F1EA] px-8 py-3 text-[10px] uppercase kerning-loose sharp-edge opacity-0 group-hover:opacity-100 transition-opacity">
                                        Connect
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const Profile = ({ user }) => (
            <div className="view-enter view-enter-active pt-48 pb-24 px-8 lg:px-24 grid grid-cols-12 gap-24">
                <div className="col-span-12 lg:col-span-4 space-y-12">
                    <h2 className="serif text-5xl italic">Operator</h2>
                    <div className="space-y-2">
                        <p className="mono text-[10px] uppercase opacity-40">Identifier</p>
                        <p className="serif text-2xl italic">{user.email}</p>
                    </div>
                    <div className="pt-12 space-y-6">
                        {['Billing & Shipping', 'Order History', 'Network Settings'].map(btn => (
                            <button key={btn} className="block text-[10px] uppercase kerning-loose font-bold border-b border-[#101113]/10 hover:border-[#101113] transition-colors pb-1 w-fit">{btn}</button>
                        ))}
                    </div>
                </div>
                <div className="col-span-12 lg:col-span-8 space-y-24">
                    <div className="bg-[#101113] text-[#F4F1EA] p-12 sharp-edge relative">
                        <h3 className="serif text-3xl italic mb-12">Security Assets</h3>
                        <div className="space-y-8">
                            <div className="border border-[#F4F1EA]/10 p-6 space-y-4">
                                <div className="flex justify-between items-center">
                                    <span className="mono text-[10px] text-[#FF5A1F]">ED25519 / PRIMARY_KEY</span>
                                    <button className="text-[8px] uppercase kerning-loose opacity-40 hover:opacity-100">Revoke</button>
                                </div>
                                <div className="mono text-[11px] break-all opacity-40 leading-relaxed bg-black/20 p-4">
                                    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK9pG8...[SHA256:4k8L2n...x9Z2]
                                </div>
                            </div>
                            <button className="w-full border border-dashed border-[#F4F1EA]/20 py-4 mono text-[10px] uppercase kerning-loose hover:bg-white/5 transition-colors">
                                + Append Public Key
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );

        const HowItWorks = () => (
            <div className="view-enter view-enter-active pt-48 pb-24 px-8 lg:px-24">
                <h2 className="serif text-7xl italic mb-32">The Architecture.</h2>
                <div className="grid grid-cols-12 border-t border-[#101113]/10">
                    {[
                        { s: '01', t: 'Initialization', d: 'Configure your silicon manifest and interconnect topology.' },
                        { s: '02', t: 'Provisioning', d: 'Physical routing of bare-metal nodes. Zero hypervisor overhead.' },
                        { s: '03', t: 'Deployment', d: 'Instant access via SSH identity. Direct control of the metal.' }
                    ].map((item, i) => (
                        <div key={item.s} className="col-span-12 lg:col-span-4 border-l border-[#101113]/10 p-12 hover:bg-[#0C1F16] hover:text-[#F4F1EA] transition-all duration-700 group relative">
                            <div className="mono text-[#FF5A1F] mb-12">{item.s}</div>
                            <h3 className="serif text-4xl mb-6 italic">{item.t}</h3>
                            <p className="text-sm opacity-50 group-hover:opacity-80 leading-relaxed">{item.d}</p>
                            {i === 2 && <div className="absolute right-0 top-0 bottom-0 w-[1px] bg-[#101113]/10"></div>}
                        </div>
                    ))}
                </div>
                <div className="mt-32 grid grid-cols-12 gap-12">
                    <div className="col-span-12 lg:col-span-6 bg-[#0D161E] text-[#F4F1EA] p-16 sharp-edge">
                        <h4 className="serif text-3xl italic mb-6">Hosted Backbone</h4>
                        <p className="text-sm opacity-60 leading-relaxed">Global edge connectivity. 400Gb/s NDR InfiniBand interconnects as the default standard.</p>
                    </div>
                    <div className="col-span-12 lg:col-span-6 border border-[#101113]/10 p-16 sharp-edge">
                        <h4 className="serif text-3xl italic mb-6">Physical Delivery</h4>
                        <p className="text-sm opacity-40 leading-relaxed">Rigs delivered in specialized environments. Same-day logistics for major technical hubs.</p>
                    </div>
                </div>
            </div>
        );

        // --- MAIN APP ---

        const App = () => {
            const [view, setView] = useState('landing');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [user, setUser] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('customrig_auth');
                if (saved) {
                    setIsAuthenticated(true);
                    setUser(JSON.parse(saved));
                }
                window.scrollTo(0, 0);
            }, [view]);

            const login = () => {
                const mockUser = { email: 'jony@lovefrom.com' };
                localStorage.setItem('customrig_auth', JSON.stringify(mockUser));
                setIsAuthenticated(true);
                setUser(mockUser);
                setView('dashboard');
            };

            const logout = () => {
                localStorage.removeItem('customrig_auth');
                setIsAuthenticated(false);
                setUser(null);
                setView('landing');
            };

            return (
                <div className="min-h-screen">
                    <Nav currentView={view} setView={setView} isAuthenticated={isAuthenticated} logout={logout} />
                    
                    <main>
                        {view === 'landing' && <Landing onAction={() => setView(isAuthenticated ? 'dashboard' : 'login')} />}
                        {view === 'login' && <Login onLogin={login} />}
                        {view === 'dashboard' && <Dashboard />}
                        {view === 'profile' && <Profile user={user} />}
                        {view === 'how-it-works' && <HowItWorks />}
                    </main>

                    <footer className="px-8 py-24 bg-[#101113] text-[#F4F1EA] flex justify-between items-center">
                        <div className="serif text-xl italic opacity-50">CustomRig</div>
                        <div className="mono text-[10px] uppercase kerning-loose opacity-20">
                            &copy; 2026 CustomRig Group. Silicon Sovereignty.
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
